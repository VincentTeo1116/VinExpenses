<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="/host-redirect.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Page not found · ManaDuit</title>
    <link rel="icon" href="/icon.png" type="image/png" />
    <link rel="stylesheet" href="/404.css" />
  </head>
  <body>
    <main class="nf">
      <p class="code" aria-hidden="true">404</p>
      <h1 id="title">We can’t find that page</h1>
      <p id="text">The address may have a typo, or the page may have moved. Nothing is wrong with your account or your data.</p>
      <div class="actions">
        <button id="back" type="button" class="btn primary">Go back</button>
        <a id="home" class="btn outline" href="/app">Go to the app</a>
      </div>
      <p id="count" class="count" role="status" aria-live="polite"></p>
    </main>
    <noscript><p class="count"><a href="/app">Go to the app</a></p></noscript>
    <script src="/404.js"></script>
  </body>
</html>

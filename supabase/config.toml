project_id = "vinexpenses"

[functions.receipt-ocr]
verify_jwt = true

[functions.receipt-ai]
verify_jwt = true

[functions.nearby-place]
verify_jwt = true

[functions.monthly-report-email]
verify_jwt = false

[functions.delete-account]
verify_jwt = true

# Email confirmation request: signed-in users only.
[functions.email-verify]
verify_jwt = true

# The links inside our emails (confirm / unsubscribe) are opened by people who are not signed in to the app and by
# mail providers' one-click Unsubscribe buttons. They cannot carry a login, so the gateway check is off for this one
# function only. It is protected instead by signed, expiring, single-purpose tokens (see _shared/email-tokens.ts).
[functions.email-action]
verify_jwt = false

# Administrator-only email service test.
[functions.admin-email-test]
verify_jwt = true

# Telegram calls this address itself and cannot send a login, so the gateway check is off for this one function.
# It is protected instead by Telegram's secret header (TELEGRAM_WEBHOOK_SECRET), compared in constant time.
[functions.telegram-bot]
verify_jwt = false

# The website's "Connect Telegram" card: signed-in users only.
[functions.telegram-link]
verify_jwt = true

# Called by the database scheduler (secret header), like monthly-report-email.
[functions.telegram-digest]
verify_jwt = false

# The Mini App's data service. It has no login of its own: every request must carry Telegram's signed initData, which
# the function verifies (HMAC with your bot token) before touching any data. The gateway's JWT check is off because the
# Mini App has no Supabase session.
[functions.miniapp-api]
verify_jwt = false

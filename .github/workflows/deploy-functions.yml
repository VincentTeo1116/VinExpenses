name: Deploy Supabase functions

# Redeploys the Edge Functions (email, Telegram bot, receipt scanning...) whenever their code changes on main.
# The database tables are NOT changed by this: run supabase-schema.sql yourself in the SQL Editor when it changes.
#
# One-time setup (Repo -> Settings -> Secrets and variables -> Actions -> New repository secret):
#   SUPABASE_ACCESS_TOKEN   Supabase dashboard -> Account (top right) -> Access Tokens -> Generate new token
#   SUPABASE_PROJECT_REF    the part before .supabase.co in your project address (20 lowercase letters)
# The token can manage your whole Supabase account: keep it only here, never in code, and revoke it if it leaks.
#
# Safety: runs only on pushes to main (never on pull requests, so a stranger's pull request can not reach the
# token), runs the tests first, and uses a pinned version of the Supabase command line.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - "smart-entry.js"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-functions
  cancel-in-progress: false   # never stop a deploy half way

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      # A failing test stops the deploy, so broken function code never goes live.
      - name: Run tests
        run: node --test "tests/*.test.js"

      - name: Deploy all functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF repository secrets (see the top of this file)."
            exit 1
          fi
          if ! echo "$SUPABASE_PROJECT_REF" | grep -Eq '^[a-z]{20}$'; then
            echo "::error::SUPABASE_PROJECT_REF must be the 20-letter project reference, not a URL."
            exit 1
          fi
          # Exact version pinned: a newly published package can not change what runs here until you update this line.
          # --yes: CI can not answer the "Deploy N functions?" question. Without it nothing is deployed.
          npx --yes supabase@3.0.0 functions deploy --yes --remote="$SUPABASE_PROJECT_REF"

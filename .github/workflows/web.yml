# Checks the React app on every push and pull request. It never deploys anything and never receives a secret.
# The slow browser tests are split into three parallel jobs, so the whole check takes about as long as one third of them.
# "Deploy to Cloudflare" waits for this whole workflow, so every job below must pass before anything is deployed.
name: Web app checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to a commit, because a tag can be moved to different code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      # Exact versions from the lockfile; install scripts are switched off in .npmrc
      - name: Install
        run: npm ci

      - name: Only high-severity problems in code that ships to users stop the build
        run: npm audit --omit=dev --audit-level=high

      - name: Lint (includes the security rules)
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and component tests
        run: npm run test:web

      - name: Production build (dummy public settings)
        env:
          VITE_SUPABASE_URL: https://example-project.supabase.co
          VITE_SUPABASE_ANON_KEY: dummy-public-key-for-ci-only-000000
        run: npm run build

      - name: Backend tests
        run: npm test

  browser:
    name: browser (part ${{ matrix.shard }} of 3)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false # one failing part must not hide what the others found
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install
        run: npm ci

      - name: Browser tests (this part)
        run: |
          npx playwright install --with-deps chromium
          npm run build:e2e
          npx playwright test --shard=${{ matrix.shard }}/3

name: Deploy to GitHub Pages

# Builds config.js from repository secrets, then publishes only the site files.
# One-time setup:
#   1. Repo → Settings → Secrets and variables → Actions → New repository secret:
#        SUPABASE_URL        (e.g. https://xxxx.supabase.co)
#        SUPABASE_ANON_KEY   (the public "anon" key)
#   2. Repo → Settings → Pages → Build and deployment → Source: "GitHub Actions"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate config.js from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node build-config.js

      - name: Stage site files
        run: |
          mkdir dist
          cp index.html app.js config.js style.css sw.js manifest.json icon.png dist/
          cp -r icons dist/icons

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4

name: Deploy to GitHub Pages

# The app lives on Cloudflare. The old GitHub Pages address only publishes a small "we have moved" site that sends every old address
# to the same page on the new one (tools/build-redirect.js). Set the repository variable REDIRECT_TO to change the new address.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      REDIRECT_TO: ${{ vars.REDIRECT_TO || 'https://vinexpenses.tkqvincent2.workers.dev' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      # Actions are pinned to a commit, because a tag can be moved to different code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # the build never needs to push, so don't leave a token lying around

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      # A failing check stops the deploy, so a redirect that could send people to the wrong place is never published
      - name: Check the redirect, then build it
        run: |
          node --test tests/redirect.test.js
          if [ -f CNAME ]; then BASE="/"; else BASE="/${GITHUB_REPOSITORY#*/}/"; fi
          BASE="$BASE" node tools/build-redirect.js dist

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # v4 and later leave dotfiles out of the site; the redirect needs none
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      # The deploy failed with "No artifacts named github-pages" although the upload had worked, so the three Pages actions
      # are on their current releases. GitHub can also briefly fail to find a just-uploaded site, so the deploy is tried once more.
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        continue-on-error: true

      - name: Wait a moment before trying the deploy again
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

name: Deploy to GitHub Pages

# Builds config.js from repo secrets and publishes the site to GitHub Pages (setup steps are in the README).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Actions are pinned to a commit, because a tag can be moved to different code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # the build never needs to push, so don't leave a token lying around

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24   # the tests load the TypeScript helpers directly (type stripping is on by default in 24)

      # Fails if any file in vendor/ was changed, added or removed without going through tools/vendor.js
      - name: Verify self-hosted libraries
        run: node tools/vendor.js verify

      # A failing test stops the deploy, so a broken receipt reader, category rule or security rule never reaches your phone
      - name: Run tests
        run: node --test "tests/*.test.js"

      - name: Generate config.js from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node build-config.js

      - name: Stage site files
        run: |
          mkdir dist
          cp index.html app.js plan.js finance-calc.js receipt-parser.js smart-entry.js csv-import.js config.js style.css fonts.css frame-guard.js email-action.html email-action.js email-action.css welcome.html privacy.html terms.html pages.css sw.js manifest.json icon.png dist/
          cp -r icons dist/icons
          cp -r landing dist/landing   # screenshots for welcome.html
          cp -r vendor dist/vendor
          cp -r miniapp dist/miniapp   # the Telegram Mini App (opened from the bot)
          rm dist/vendor/vendor.config.json dist/vendor/VENDOR.lock.json   # build metadata, not part of the site
          # Stamp the build with the commit id so browsers fetch the new files.
          BUILD="${GITHUB_SHA::7}"
          sed -i "s/__BUILD__/${BUILD}/g" dist/index.html dist/app.js dist/style.css dist/sw.js

      # Limit the page to your own Supabase project; the deploy fails if a wildcard is left.
      - name: Pin the Content-Security-Policy to your Supabase project
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: node tools/pin-csp.js dist/index.html dist/email-action.html dist/miniapp/index.html

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

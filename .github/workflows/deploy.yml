name: Deploy to GitHub Pages

# Builds config.js from repository secrets, then publishes only the site files.
# One-time setup:
#   1. Repo → Settings → Secrets and variables → Actions → New repository secret:
#        SUPABASE_URL        (e.g. https://xxxx.supabase.co)
#        SUPABASE_ANON_KEY   (the public "anon" key)
#   2. Repo → Settings → Pages → Build and deployment → Source: "GitHub Actions"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Every action is pinned to an exact commit, not a tag: a tag can be moved to different code, a commit cannot.
      # Dependabot (.github/dependabot.yml) proposes updates, and the comment names the release each hash is.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # the build never needs to push, so don't leave a token lying around

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24   # the tests load the TypeScript helpers directly (type stripping is on by default in 24)

      # Fails if any file in vendor/ was changed, added or removed without going through tools/vendor.js
      - name: Verify self-hosted libraries
        run: node tools/vendor.js verify

      # A failing test stops the deploy, so a broken receipt reader, category rule or security rule never reaches your phone
      - name: Run tests
        run: node --test "tests/*.test.js"

      - name: Generate config.js from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node build-config.js

      - name: Stage site files
        run: |
          mkdir dist
          cp index.html app.js receipt-parser.js smart-entry.js csv-import.js config.js style.css fonts.css frame-guard.js email-action.html email-action.js email-action.css sw.js manifest.json icon.png dist/
          cp -r icons dist/icons
          cp -r vendor dist/vendor
          cp -r miniapp dist/miniapp   # the Telegram Mini App (opened from the bot)
          rm dist/vendor/vendor.config.json dist/vendor/VENDOR.lock.json   # build metadata, not part of the site
          # Stamp this deploy with the commit id: it versions the CSS/JS URLs (cache busting),
          # renames the service-worker cache, and is shown in the app's Account sheet.
          BUILD="${GITHUB_SHA::7}"
          sed -i "s/__BUILD__/${BUILD}/g" dist/index.html dist/app.js dist/style.css dist/sw.js

      # The committed page allows any *.supabase.co address (so local development works). Production allows ONLY yours.
      # This step fails the deploy if the result still contains a wildcard.
      - name: Pin the Content-Security-Policy to your Supabase project
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: node tools/pin-csp.js dist/index.html dist/email-action.html dist/miniapp/index.html

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
